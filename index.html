<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #ffffff;
            font-family: Tahoma, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-loading {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            letter-spacing: 1px;
        }

        .viewport-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
   <style>
        /* إعادة ضبط الصفحة لتملأ الشاشة بالكامل وبدون هوامش */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b; /* خلفية داكنة وفخمة تبرز حيوية الصورة المتحركة */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية الصورة لتأطيرها بشكل جذاب */
        .gif-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* تنسيق صورة الـ GIF لتتوسط الشاشة وتكون متجاوبة مع جميع الأجهزة */
        .gif-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px; /* حواف منسدلة وناعمة */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); /* ظل خفيف يمنح عمقاً وجاذبية للصورة */
        }
    </style>
</head>
<body>

    <div class="gif-container">
        <!-- ضع رابط صورة الـ GIF الخاصة بك هنا بين علامتي التنصيص -->
        <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExYjh2emhoNmV0ZzF1cWh1YXJrdWx2YmVsM3Zsd2M5ZTB3b3FsNzI5YiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/y9b4QeK13CoGk/giphy.webp" alt="عرض مميز">
    </div> 
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="brand-loading">dalaal</div>
    </div>

    <div class="viewport-container" id="viewportContainer">
        <iframe 
            id="contentFrame"
            src="https://measures-exciting-cliff-between.trycloudflare.com" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            onload="hideLoader()">
        </iframe>
    </div>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 300);
            }
        }

        setTimeout(function() {
            hideLoader();
        }, 5000);

        function adjustViewport() {
            var container = document.getElementById('viewportContainer');
            if (container) {
                container.style.height = window.innerHeight + 'px';
                container.style.width = window.innerWidth + 'px';
            }
        }

        window.addEventListener('resize', adjustViewport);
        window.addEventListener('orientationchange', function() {
            setTimeout(adjustViewport, 200);
        });
        
        adjustViewport();
    </script>

</body>
</html>
